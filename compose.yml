services:
  dev:
    image: node:22-alpine
    ports:
      - 3000:3000
    working_dir: /app
    volumes:
      - ./frontend:/app
    networks:
      - portfolio
    command: tail -f /dev/null

  py:
    build: 
      context: ./backend
      dockerfile: dockerfile
    ports:
      - 8000:8000
    working_dir: /app
    volumes:
      - ./backend:/app
    networks:
      - portfolio
networks:
  portfolio: